services:
  ollama:
    image: ollama/ollama:latest
    container_name: theia-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # ❌ УБРАЛИ healthcheck полностью

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: theia-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false
    depends_on:
      - ollama  # ❌ УБРАЛИ condition: service_healthy

volumes:
  ollama_data:
  openwebui_data: